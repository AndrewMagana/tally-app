<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally — Food Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
  :root{
    --paper:#FDFBF6;
    --paper-dim:#F5F1E7;
    --ink:#16150F;
    --hair:#DEDACB;
    --hair-strong:#16150F;
    --accent:#C4401F;   /* paprika — calories / fat */
    --accent2:#3C6E47;  /* herb green — protein */
    --accent3:#B9862E;  /* mustard — carbs */
    --muted:#7A7566;
    --danger:#C4401F;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper-dim);
    color:var(--ink);
    font-family:'Archivo',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    background:var(--paper);
    min-height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,0.06);
  }
  /* ---------- Top bar ---------- */
  .topbar{
    padding:18px 20px 14px;
    border-bottom:4px solid var(--hair-strong);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .topbar .wordmark{
    font-family:'Archivo Black',sans-serif;
    font-size:22px;
    letter-spacing:-0.02em;
  }
  .topbar .wordmark span{color:var(--accent);}
  .topbar .tagline{font-size:11px;color:var(--muted);}

  main{flex:1;padding:16px 18px 100px;}
  .panel{display:none;}
  .panel.active{display:block;}

  /* ---------- Day nav ---------- */
  .day-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .day-nav button{
    background:none;border:2px solid var(--hair-strong);width:34px;height:34px;
    font-size:16px;cursor:pointer;border-radius:var(--radius);
  }
  .day-nav button:disabled{opacity:0.25;cursor:default;}
  .day-label{font-weight:700;font-size:15px;}

  /* ---------- Hero calorie card ---------- */
  .hero-card{
    border:3px solid var(--hair-strong);
    padding:16px 18px 18px;
    margin-bottom:16px;
    background:var(--paper);
  }
  .hero-eyebrow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  .hero-number{font-family:'Archivo Black';font-size:54px;line-height:1.05;margin:2px 0 2px;}
  .hero-sub{font-size:13px;color:var(--muted);margin-bottom:10px;}
  .bar{height:10px;background:var(--paper-dim);border:1px solid var(--hair-strong);}
  .bar-fill{height:100%;background:var(--accent);}
  .bar-fill.over{background:var(--danger);}

  .macro-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;}
  .macro-card{border:2px solid var(--hair);padding:10px 10px 12px;}
  .macro-name{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  .macro-amt{font-weight:700;font-size:15px;margin-bottom:6px;}
  .macro-bar{height:6px;background:var(--paper-dim);border:1px solid var(--hair);}
  .macro-bar-fill{height:100%;}

  .section-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    border-bottom:2px solid var(--hair-strong);padding-bottom:6px;margin-bottom:8px;}

  .log-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--hair);gap:10px;}
  .log-row .name{font-weight:600;font-size:14px;}
  .log-row .desc{font-size:12px;color:var(--muted);}
  .log-row .cal{font-weight:700;font-size:14px;white-space:nowrap;}
  .log-row .del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px;}
  .empty{color:var(--muted);font-size:13px;padding:18px 0;text-align:center;}

  /* ---------- Recipes ---------- */
  .row-between{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .btn{
    font-family:'Archivo';font-weight:700;font-size:13px;
    background:var(--ink);color:var(--paper);border:none;
    padding:10px 16px;cursor:pointer;border-radius:var(--radius);
  }
  .btn.ghost{background:none;color:var(--ink);border:2px solid var(--hair-strong);}
  .btn.accent{background:var(--accent);color:#fff;}
  .btn.block{width:100%;}
  .btn.sm{padding:7px 12px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:default;}

  .recipe-card{border:2px solid var(--hair-strong);padding:12px 14px;margin-bottom:10px;cursor:pointer;}
  .recipe-card .rname{font-weight:700;font-size:15px;margin-bottom:2px;}
  .recipe-card .rmeta{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .recipe-card .rstats{display:flex;gap:14px;font-size:12px;flex-wrap:wrap;}
  .recipe-card .rstats b{font-size:13px;}

  /* ---------- Nutrition facts block ---------- */
  .nfacts{border:3px solid var(--hair-strong);padding:12px 14px 14px;background:var(--paper);}
  .nfacts-title{font-family:'Archivo Black';font-size:20px;letter-spacing:-.01em;}
  .nfacts-sub{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .nfacts-rule{border-top:1px solid var(--hair);}
  .nfacts-rule.thick{border-top:6px solid var(--hair-strong);margin:6px 0;}
  .nfacts-cal-row{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;}
  .nfacts-cal-row .nfacts-cal{font-family:'Archivo Black';font-size:28px;}
  .nfacts-row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed;left:0;right:0;bottom:0;
    max-width:480px;margin:0 auto;
    background:var(--paper);border-top:3px solid var(--hair-strong);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .navbtn{
    flex:1;padding:10px 0 8px;background:none;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--muted);font-family:'Archivo';font-size:11px;font-weight:600;
  }
  .navbtn.active{color:var(--ink);}
  .navbtn .dot{width:6px;height:6px;border-radius:50%;background:transparent;}
  .navbtn.active .dot{background:var(--accent);}

  .fab{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:52px;max-width:480px;
    width:56px;height:56px;border-radius:50%;
    background:var(--accent);color:#fff;border:3px solid var(--paper);
    font-size:28px;line-height:1;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- Overlays / sheets ---------- */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(22,21,15,0.4);
    z-index:50;justify-content:center;
  }
  .overlay.open{display:flex;}
  .sheet-body{
    background:var(--paper);width:100%;max-width:480px;
    margin-top:auto;max-height:92vh;overflow-y:auto;
    border-top:4px solid var(--hair-strong);
    padding:16px 18px calc(20px + env(safe-area-inset-bottom));
    animation:slideup .18s ease-out;
  }
  @keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .sheet-title{font-family:'Archivo Black';font-size:18px;}
  .sheet-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);}

  .menu-opt{
    display:flex;align-items:center;gap:12px;width:100%;
    border:2px solid var(--hair-strong);background:var(--paper);
    padding:14px 14px;margin-bottom:10px;cursor:pointer;text-align:left;
    font-family:'Archivo';font-weight:700;font-size:14px;
  }
  .menu-opt .ic{font-size:20px;width:22px;text-align:center;}
  .menu-opt small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px;}

  input[type=text],input[type=number],input[type=search],select{
    width:100%;padding:11px 12px;border:2px solid var(--hair-strong);
    font-family:'Archivo';font-size:14px;background:var(--paper);color:var(--ink);
    border-radius:var(--radius);appearance:none;-webkit-appearance:none;
  }
  label.field{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em;}
  .field-row{display:flex;gap:10px;}
  .field-row > div{flex:1;}

  #scanner-viewport{position:relative;width:100%;height:260px;background:#000;overflow:hidden;border:3px solid var(--hair-strong);display:flex;align-items:center;justify-content:center;}
  #scanner-viewport video, #scanner-viewport canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;}
  #scanner-viewport .cam-off-icon{color:#8a8578;font-size:13px;text-align:center;padding:0 20px;}
  .scan-hint{font-size:12.5px;color:var(--muted);text-align:center;margin:10px 0;line-height:1.4;}
  .link-btn{background:none;border:none;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline;padding:0;display:block;margin:0 auto;}

  .search-box{display:flex;gap:8px;margin-bottom:4px;}
  .search-box input{flex:1;}
  .search-result{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--hair);cursor:pointer;}
  .search-result .n{font-weight:600;font-size:13.5px;}
  .search-result .b{font-size:11.5px;color:var(--muted);}
  .search-result .k{font-size:12px;font-weight:700;white-space:nowrap;margin-left:8px;}

  .ing-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair);}
  .ing-row .n{font-weight:600;font-size:13.5px;}
  .ing-row .m{font-size:11.5px;color:var(--muted);}
  .ing-row .rm{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;}

  .goal-form label.field{margin-top:16px;}
  .msg{font-size:13px;color:var(--muted);padding:12px 0;text-align:center;}
  .msg.err{color:var(--danger);}
  .calc-card{border:2px solid var(--hair);padding:14px 14px 16px;margin-top:10px;}
  .calc-note{font-size:12px;color:var(--muted);line-height:1.4;margin-top:4px;}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div>
      <div class="wordmark">Tal<span>ly</span></div>
      <div class="tagline">calories &amp; macros</div>
    </div>
  </div>

  <main>
    <!-- TODAY -->
    <section id="panel-today" class="panel active"></section>
    <!-- RECIPES -->
    <section id="panel-recipes" class="panel"></section>
    <!-- GOALS -->
    <section id="panel-goals" class="panel"></section>
  </main>

  <button class="fab" onclick="openFoodSheet('log')" aria-label="Add food">+</button>

  <nav class="bottomnav">
    <button class="navbtn active" id="nav-today" onclick="switchTab('today')"><span class="dot"></span>Today</button>
    <button class="navbtn" id="nav-recipes" onclick="switchTab('recipes')"><span class="dot"></span>Recipes</button>
    <button class="navbtn" id="nav-goals" onclick="switchTab('goals')"><span class="dot"></span>Goals</button>
  </nav>

  <!-- FOOD SHEET (add to log OR add ingredient to recipe) -->
  <div class="overlay" id="foodSheet">
    <div class="sheet-body" id="foodSheetBody"></div>
  </div>

  <!-- RECIPE EDITOR -->
  <div class="overlay" id="recipeEditorOverlay">
    <div class="sheet-body" id="recipeEditorBody"></div>
  </div>

  <!-- RECIPE DETAIL -->
  <div class="overlay" id="recipeDetailOverlay">
    <div class="sheet-body" id="recipeDetailBody"></div>
  </div>

</div>

<script>
/* ============================= ERROR REPORTING ============================= */
function showFatalError(msg){
  let el = document.getElementById('fatal-error-banner');
  if(!el){
    el = document.createElement('div');
    el.id = 'fatal-error-banner';
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;background:#C4401F;color:#fff;padding:12px 16px;font-family:sans-serif;font-size:13px;line-height:1.4;';
    document.body.prepend(el);
  }
  el.textContent = 'Error: ' + msg;
}
window.addEventListener('error', function(e){ showFatalError(e.message + ' (line ' + e.lineno + ')'); });
window.addEventListener('unhandledrejection', function(e){ showFatalError((e.reason && e.reason.message) ? e.reason.message : String(e.reason)); });

/* ============================= STORAGE ============================= */
// Uses Claude's window.storage when available (in-chat preview); falls back
// to plain localStorage when the app is opened as its own page (Home Screen,
// or hosted elsewhere) so it keeps working outside the chat sandbox too.
function hasClaudeStorage(){
  return typeof window.storage === 'object' && window.storage && typeof window.storage.get === 'function';
}
async function storeGet(key, fallback){
  if(hasClaudeStorage()){
    try{ const r = await window.storage.get(key,false); return r? JSON.parse(r.value): fallback; }
    catch(e){ /* fall through to localStorage */ }
  }
  try{
    const raw = localStorage.getItem(key);
    return raw!=null ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function storeSet(key, val){
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, JSON.stringify(val), false); return; }
    catch(e){ /* fall through to localStorage */ }
  }
  try{ localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ console.error('storage set failed', key, e); }
}

/* ============================= STATE ============================= */
let state = {
  date: todayStr(),
  goals: {calories:2000, protein:150, carbs:225, fat:65},
  log: [],
  recipes: [],
  customFoods: [],
  macroCalc: {weight:'', unit:'lb', proteinMult:0.8, fatMult:0.3}
};

function todayStr(d=new Date()){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function round1(n){ return Math.round((n||0)*10)/10; }
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================= INIT ============================= */
async function init(){
  state.goals = await storeGet('goals', state.goals);
  state.recipes = await storeGet('recipes', []);
  state.customFoods = await storeGet('custom-foods', []);
  state.macroCalc = await storeGet('macro-calc', state.macroCalc);
  state.log = await storeGet('log-'+state.date, []);
  renderToday();
  renderRecipes();
  renderGoals();
}
init();

/* ============================= TABS ============================= */
function switchTab(tab){
  ['today','recipes','goals'].forEach(t=>{
    document.getElementById('panel-'+t).classList.toggle('active', t===tab);
    document.getElementById('nav-'+t).classList.toggle('active', t===tab);
  });
  document.querySelector('.fab').style.display = (tab==='today') ? 'flex' : 'none';
}

/* ============================= TODAY ============================= */
async function changeDay(delta){
  const d = new Date(state.date+'T00:00:00');
  d.setDate(d.getDate()+delta);
  const next = todayStr(d);
  if(next > todayStr()) return;
  state.date = next;
  state.log = await storeGet('log-'+state.date, []);
  renderToday();
}

function dateLabel(dateStr){
  if(dateStr===todayStr()) return 'Today';
  const y = new Date(); y.setDate(y.getDate()-1);
  if(dateStr===todayStr(y)) return 'Yesterday';
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

function dayTotals(){
  return state.log.reduce((a,e)=>{
    a.cal+=e.calories; a.protein+=e.protein; a.carbs+=e.carbs; a.fat+=e.fat; return a;
  },{cal:0,protein:0,carbs:0,fat:0});
}

function macroCardHTML(name, amt, goal, color){
  const pct = goal>0 ? Math.min(100, Math.round(amt/goal*100)) : 0;
  return `<div class="macro-card">
    <div class="macro-name">${name}</div>
    <div class="macro-amt">${round1(amt)}<span style="font-weight:400;color:var(--muted);font-size:11px;"> / ${round1(goal)}g</span></div>
    <div class="macro-bar"><div class="macro-bar-fill" style="width:${pct}%;background:${color}"></div></div>
  </div>`;
}

function logRowHTML(e){
  return `<div class="log-row">
    <div>
      <div class="name">${escapeHtml(e.name)}</div>
      <div class="desc">${escapeHtml(e.desc||'')}</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="cal">${Math.round(e.calories)} kcal</div>
      <button class="del" onclick="deleteLogEntry('${e.id}')" aria-label="Remove">×</button>
    </div>
  </div>`;
}

function renderToday(){
  const t = dayTotals();
  const g = state.goals;
  const remaining = Math.round(g.calories - t.cal);
  const pct = g.calories>0 ? Math.min(100, Math.round(t.cal/g.calories*100)) : 0;
  const isToday = state.date===todayStr();
  document.getElementById('panel-today').innerHTML = `
    <div class="day-nav">
      <button onclick="changeDay(-1)">‹</button>
      <div class="day-label">${dateLabel(state.date)}</div>
      <button onclick="changeDay(1)" ${isToday?'disabled':''}>›</button>
    </div>
    <div class="hero-card">
      <div class="hero-eyebrow">Calories remaining</div>
      <div class="hero-number">${Math.max(0,remaining)}</div>
      <div class="hero-sub">${Math.round(t.cal)} eaten · ${g.calories} goal${remaining<0?` · ${Math.abs(remaining)} over`:''}</div>
      <div class="bar"><div class="bar-fill ${t.cal>g.calories?'over':''}" style="width:${pct}%"></div></div>
    </div>
    <div class="macro-grid">
      ${macroCardHTML('Protein', t.protein, g.protein, 'var(--accent2)')}
      ${macroCardHTML('Carbs', t.carbs, g.carbs, 'var(--accent3)')}
      ${macroCardHTML('Fat', t.fat, g.fat, 'var(--accent)')}
    </div>
    <div class="section-label">Logged</div>
    ${state.log.length ? state.log.map(logRowHTML).join('') : `<div class="empty">Nothing logged yet — tap + to add a food.</div>`}
  `;
}

async function deleteLogEntry(id){
  state.log = state.log.filter(e=>e.id!==id);
  await storeSet('log-'+state.date, state.log);
  renderToday();
}

async function addLogEntry(item, qty){
  const entry = {
    id: 'e'+Date.now()+Math.random().toString(36).slice(2,6),
    name: item.name,
    desc: `${qty} × ${item.unitLabel}`,
    calories: item.perUnit.cal*qty,
    protein: item.perUnit.protein*qty,
    carbs: item.perUnit.carbs*qty,
    fat: item.perUnit.fat*qty
  };
  state.log.push(entry);
  await storeSet('log-'+state.date, state.log);
  await rememberCustomFood(item);
  renderToday();
}

async function rememberCustomFood(item){
  const key = (item.name+'|'+(item.brand||'')).toLowerCase();
  state.customFoods = state.customFoods.filter(f=>(f.name+'|'+(f.brand||'')).toLowerCase()!==key);
  state.customFoods.unshift(item);
  state.customFoods = state.customFoods.slice(0,20);
  await storeSet('custom-foods', state.customFoods);
}

/* ============================= NUTRITION FACTS BLOCK ============================= */
function nutritionFactsHTML(title, sub, cal, protein, carbs, fat){
  return `<div class="nfacts">
    <div class="nfacts-title">Nutrition Facts</div>
    <div class="nfacts-sub">${escapeHtml(title)}${sub?' · '+escapeHtml(sub):''}</div>
    <div class="nfacts-rule thick"></div>
    <div class="nfacts-cal-row"><span>Calories</span><span class="nfacts-cal">${Math.round(cal)}</span></div>
    <div class="nfacts-rule thick"></div>
    <div class="nfacts-row"><span>Protein</span><span>${round1(protein)} g</span></div>
    <div class="nfacts-rule"></div>
    <div class="nfacts-row"><span>Carbohydrates</span><span>${round1(carbs)} g</span></div>
    <div class="nfacts-rule"></div>
    <div class="nfacts-row"><span>Fat</span><span>${round1(fat)} g</span></div>
  </div>`;
}

/* ============================= OPEN FOOD FACTS ============================= */
function kcalFromNutriments(n){
  if(n['energy-kcal_100g']!=null) return Number(n['energy-kcal_100g']);
  if(n['energy-kcal']!=null) return Number(n['energy-kcal']);
  if(n['energy_100g']!=null) return Number(n['energy_100g'])/4.184;
  return 0;
}
function scaleMacros(m, factor){
  return {cal:round1(m.cal*factor), protein:round1(m.protein*factor), carbs:round1(m.carbs*factor), fat:round1(m.fat*factor)};
}
function normalizeOFF(p){
  const n = p.nutriments || {};
  const per100 = {
    cal: round1(kcalFromNutriments(n)),
    protein: round1(Number(n['proteins_100g'])||0),
    carbs: round1(Number(n['carbohydrates_100g'])||0),
    fat: round1(Number(n['fat_100g'])||0)
  };
  let unitLabel, perUnit;
  const sq = Number(p.serving_quantity);
  if(sq && sq>0){
    unitLabel = `serving (${p.serving_size ? p.serving_size : sq+' g'})`;
    perUnit = scaleMacros(per100, sq/100);
  } else {
    unitLabel = '100 g';
    perUnit = per100;
  }
  return {
    name: (p.product_name||'').trim() || 'Unnamed product',
    brand: p.brands ? p.brands.split(',')[0].trim() : '',
    barcode: p.code || '',
    unitLabel, perUnit
  };
}
async function offLookupBarcode(code){
  const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json`);
  const data = await res.json();
  if(data && data.status===1 && data.product) return normalizeOFF(data.product);
  return null;
}
async function offSearch(query){
  const res = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=20`);
  const data = await res.json();
  return (data.products||[]).filter(p=>p.product_name).map(normalizeOFF);
}

/* ---- barcode scanner (Quagga) ---- */
let scannerRunning = false;

async function requestCameraAccess(){
  if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    sheet.scanMsg = "Camera access needs a secure (https) connection and isn't available here — enter the barcode number instead.";
    renderFoodSheet();
    return;
  }
  sheet.scanMsg = 'Requesting camera access…';
  renderFoodSheet();
  try{
    // Trigger the OS/browser permission prompt directly from this tap.
    const testStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false });
    testStream.getTracks().forEach(tr=>tr.stop());
  }catch(err){
    let msg = 'Camera unavailable — enter the barcode number instead.';
    if(err && (err.name==='NotAllowedError' || err.name==='PermissionDeniedError')){
      msg = "Camera access was denied. Enable it for this site in your phone's Settings, then try again — or enter the barcode number instead.";
    } else if(err && err.name==='NotFoundError'){
      msg = 'No camera found on this device — enter the barcode number instead.';
    } else if(err && err.name==='NotReadableError'){
      msg = 'The camera is being used by another app right now — enter the barcode number instead.';
    }
    sheet.scanMsg = msg;
    renderFoodSheet();
    return;
  }
  sheet.cameraOn = true;
  sheet.scanMsg = 'Starting camera…';
  renderFoodSheet();
  requestAnimationFrame(startScanner);
}

function startScanner(){
  const target = document.getElementById('scanner-viewport');
  if(!target || typeof Quagga==='undefined'){
    sheet.scanMsg="Camera scanning isn't available in this browser — enter the barcode number instead.";
    sheet.cameraOn=false;
    renderFoodSheet();
    return;
  }
  try{
    Quagga.init({
      inputStream:{ name:'Live', type:'LiveStream', target, constraints:{ facingMode:{ ideal:'environment' } } },
      locator:{ patchSize:'medium', halfSample:true },
      decoder:{ readers:['ean_reader','ean_8_reader','upc_reader','upc_e_reader'] },
      locate:true
    }, function(err){
      if(err){
        sheet.scanMsg='Camera unavailable — enter the barcode number instead.';
        sheet.cameraOn=false;
        renderFoodSheet();
        return;
      }
      scannerRunning = true;
      Quagga.start();
      sheet.scanMsg='Point your camera at the barcode.';
      const s = document.getElementById('scan-status');
      if(s) s.textContent = sheet.scanMsg;
    });
    Quagga.offDetected(onBarcodeDetected);
    Quagga.onDetected(onBarcodeDetected);
  }catch(e){
    sheet.scanMsg='Camera unavailable — enter the barcode number instead.';
    sheet.cameraOn=false;
    renderFoodSheet();
  }
}
function stopScanner(){
  if(scannerRunning){ try{ Quagga.offDetected(onBarcodeDetected); Quagga.stop(); }catch(e){} scannerRunning=false; }
  sheet.cameraOn=false;
}
let lastScan = 0;
async function onBarcodeDetected(result){
  const now = Date.now();
  if(now-lastScan < 1200) return;
  lastScan = now;
  const code = result.codeResult.code;
  const s = document.getElementById('scan-status');
  if(s) s.textContent = 'Found '+code+' — looking it up…';
  stopScanner();
  try{
    const item = await offLookupBarcode(code);
    if(item){ sheet.pendingItem=item; sheet.qty=1; goSheet('detail'); }
    else {
      sheet.view='manualBarcode';
      sheet.error = `No product found for ${code}.`;
      renderFoodSheet();
      const bi = document.getElementById('barcode-input');
      if(bi) bi.value = code;
    }
  }catch(e){
    sheet.view='manualBarcode'; sheet.error='Lookup failed — check your connection.'; renderFoodSheet();
  }
}

function recipeTotals(draft){
  return draft.ingredients.reduce((a,ing)=>{
    a.cal += ing.perUnit.cal*ing.qty;
    a.protein += ing.perUnit.protein*ing.qty;
    a.carbs += ing.perUnit.carbs*ing.qty;
    a.fat += ing.perUnit.fat*ing.qty;
    return a;
  },{cal:0,protein:0,carbs:0,fat:0});
}

      <div class="calc-note">Estimate protein and fat from body weight, then fill in carbs from what's left of your calorie goal above.</div>
      <div class="field-row">
        <div><label class="field">Body weight</label><input type="number" id="mc-weight" value="${escapeHtml(String(mc.weight||''))}" inputmode="decimal" placeholder="e.g. 165"></div>
        <div><label class="field">Unit</label>
          <select id="mc-unit">
            <option value="lb" ${mc.unit==='lb'?'selected':''}>lb</option>
            <option value="kg" ${mc.unit==='kg'?'selected':''}>kg</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div><label class="field">Protein (g / lb)</label><input type="number" id="mc-protein-mult" value="${mc.proteinMult}" inputmode="decimal" step="0.05"></div>
        <div><label class="field">Fat (g / lb)</label><input type="number" id="mc-fat-mult" value="${mc.fatMult}" inputmode="decimal" step="0.05"></div>
      </div>
      <div class="calc-note">Common starting points: 0.8 g protein per lb bodyweight, 0.3 g fat per lb for a fat-loss deficit. Edit either number to match your own plan — if you're in kg, weight is converted to lb before multiplying.</div>
      <button class="btn ghost block" style="margin-top:12px;" onclick="calculateMacros()">Calculate &amp; fill in goals</button>
      <div id="mc-preview"></div>
    </div>
  `;
}
async function saveGoals(){
  state.goals = {
    calories: parseFloat(document.getElementById('g-cal').value)||0,
    protein: parseFloat(document.getElementById('g-protein').value)||0,
    carbs: parseFloat(document.getElementById('g-carbs').value)||0,
    fat: parseFloat(document.getElementById('g-fat').value)||0
  };
  await storeSet('goals', state.goals);
  document.getElementById('goals-saved').textContent = 'Saved.';
  renderToday();
}
async function calculateMacros(){
  const weight = parseFloat(document.getElementById('mc-weight').value)||0;
  const unit = document.getElementById('mc-unit').value;
  const proteinMult = parseFloat(document.getElementById('mc-protein-mult').value)||0;
  const fatMult = parseFloat(document.getElementById('mc-fat-mult').value)||0;
  const weightLb = unit==='kg' ? weight*2.20462 : weight;

  const proteinG = round1(weightLb*proteinMult);
  const fatG = round1(weightLb*fatMult);
  const calGoal = parseFloat(document.getElementById('g-cal').value)||0;
  const carbsG = Math.max(0, round1((calGoal - proteinG*4 - fatG*9)/4));

  document.getElementById('g-protein').value = proteinG;
  document.getElementById('g-fat').value = fatG;
  document.getElementById('g-carbs').value = carbsG;

  document.getElementById('mc-preview').innerHTML = `
    <div class="calc-note" style="margin-top:10px;">
      At ${weight||0} ${unit} → <b>${proteinG}g protein</b>, <b>${fatG}g fat</b>, and <b>${carbsG}g carbs</b> to hit ${calGoal||0} calories.
      Values are filled in above — tap <b>Save goals</b> to confirm.
    </div>`;

  state.macroCalc = { weight, unit, proteinMult, fatMult };
  await storeSet('macro-calc', state.macroCalc);
}
</script>
</body>
</html>
